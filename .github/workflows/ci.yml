name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    name: Compile zero-dependency backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile with Java 11 target
        run: |
          mkdir -p out
          javac --release 11 -d out src/Main.java

      - name: Verify the ship includes the web app
        run: test -s public/index.html && echo "UI present"
